name: audit-self

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Fetch pinned codex_audit.sh
        env:
          CODEX_AUDIT_COMMIT: 35593648f445bcdf0ab716b07597006af9126fad
          CODEX_AUDIT_SHA256: 63bdcaba4d875430232ed11318ebb53e6f57ea2b0304fd441b0bd3c6364a5471
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/Elmahrosa/elmahrosa-org/${CODEX_AUDIT_COMMIT}/audit-tools/codex_audit.sh"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 "$url" -o codex_audit.sh
          echo "${CODEX_AUDIT_SHA256}  codex_audit.sh" | sha256sum --check --strict
          chmod +x codex_audit.sh

      - name: Run readiness audit
        run: ./codex_audit.sh

      - name: Commit audit data
        env:
          PUSH_TOKEN: ${{ secrets.AUDIT_TOOLS_PAT || github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- audit-data docs/data || true
          if git diff --cached --quiet; then
            echo "No audit data changes"
            exit 0
          fi
          git commit -m "chore: refresh audit data [skip ci]"
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
